<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123B4A">
<title>منشورات العيادة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style id="appcss">
:root{--bg:#EEF2F3;--surface:#fff;--ink:#17262C;--muted:#5A6A70;--line:#D3DCDF;--pri:#123B4A;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--uif),system-ui,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #1C7C8C;outline-offset:2px}
header.app{background:var(--pri);color:#fff;padding:16px}
header.app .in{max-width:900px;margin:0 auto}
header.app h1{margin:0;font-size:1.3rem}
header.app p{margin:2px 0 0;opacity:.85;font-size:.9rem}
main{max-width:900px;margin:0 auto;padding:16px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:1.05rem}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fonts button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;font-size:1.15rem;line-height:1.4}
.fonts button small{display:block;font-size:.72rem;color:var(--muted);font-family:system-ui,sans-serif}
.fonts button[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:.85rem;color:var(--muted);font-weight:700;margin-bottom:3px}
label.f input,label.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
label.f textarea{min-height:60px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:560px){.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.92rem}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.88rem;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.thumb{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:right;padding:0}
.thumb .sc{width:100%;aspect-ratio:4/5;overflow:hidden;position:relative;background:#ddd}
.thumb .sc>div{position:absolute;top:0;right:0;transform-origin:top right}
.thumb b{display:block;padding:8px 10px;font-size:.88rem}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.scrim.open{display:flex}
.viewer{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:12px}
.viewer .big{width:100%;aspect-ratio:4/5;overflow:hidden;position:relative;border-radius:8px;background:#ddd}
.viewer .big>div{position:absolute;top:0;right:0;transform-origin:top right}
.viewer textarea{width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.9rem}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 15px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;font-size:.9rem}.toast.show{opacity:1}
</style>
<style id="cardcss">
.card{width:1080px;height:1350px;background:#fff;position:relative;overflow:hidden;font-family:var(--cf),"DejaVu Sans",sans-serif;color:#17262C;display:flex;flex-direction:column;direction:rtl;text-align:right}
.card *{box-sizing:border-box}
.hero{background:var(--c);color:#fff;height:430px;position:relative;padding:44px 60px 0;overflow:hidden;flex:none}
.ring{position:absolute;left:-130px;top:-130px;width:640px;height:640px;border-radius:50%;border:70px solid rgba(255,255,255,.07)}
.ring2{position:absolute;left:-20px;top:-20px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06)}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.cat{background:rgba(255,255,255,.2);border-radius:40px;padding:6px 24px;font-size:28px;font-weight:700}
.kick{background:#fff;color:var(--c);border-radius:40px;padding:6px 22px;font-size:26px;font-weight:800}
.card h1{position:relative;font-size:74px;line-height:1.25;margin:30px 0 0;max-width:600px;font-weight:800}
.sub{position:relative;font-size:30px;opacity:.95;margin-top:12px;max-width:600px;line-height:1.5}
.art{position:absolute;left:66px;top:94px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,255,255,.07)}
.art svg{width:230px;height:230px}
.body{flex:1;padding:22px 44px 12px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sec{flex:1;border-radius:26px;background:var(--t);padding:16px 26px 12px;position:relative;overflow:hidden;min-height:0}
.sec h3{margin:0 0 8px;font-size:36px;color:var(--c);display:flex;align-items:center;gap:14px;font-weight:800;line-height:1.3}
.sec h3 i{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-size:27px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.it{display:flex;gap:12px;font-size:var(--fs,30px);line-height:1.45;font-weight:500}
.it b{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:.62em}
.sec.warn{background:#FDECEC}.sec.warn h3{color:#B42318}.sec.warn h3 i,.sec.warn .it b{background:#B42318}
.cta{flex:none;margin:0 44px 14px;border-radius:20px;background:var(--c);color:#fff;padding:14px 26px;font-size:var(--ctafs,31px);font-weight:700;line-height:1.45;text-align:center}
.ft{flex:none;display:flex;justify-content:space-between;align-items:center;padding:16px 54px;background:#123B4A;color:#fff;gap:20px}
.ft b{display:block;font-size:32px;font-weight:800}.ft span{font-size:23px;opacity:.88}
.ft .ph{font-size:30px;font-weight:800;direction:ltr;white-space:nowrap}
.logo{width:64px;height:64px;border-radius:16px;background:#fff;position:relative;flex:none}
.logo::before,.logo::after{content:"";position:absolute;background:#123B4A;border-radius:3px}
.logo::before{left:26px;top:12px;width:12px;height:40px}.logo::after{left:12px;top:26px;width:40px;height:12px}
</style>
</head>
<body>
<header class="app"><div class="in"><h1>منشورات العيادة</h1><p>اختر الخط، اكتب بياناتك، ثم نزّل الصور أو شاركها على فيسبوك مباشرة.</p></div></header>
<main>
 <div class="panel"><h2>نوع الخط</h2><div class="fonts" id="fonts"></div><p class="status" id="fstat"></p></div>
 <div class="panel"><h2>بيانات العيادة والعبارة الختامية</h2>
  <div class="g2"><label class="f"><span>اسم الطبيب</span><input id="i_name"></label><label class="f"><span>التخصص</span><input id="i_spec"></label></div>
  <div class="g2"><label class="f"><span>رقم الحجز (يظهر على الصورة)</span><input id="i_phone" dir="ltr" placeholder="059 000 0000"></label><label class="f"><span>عنوان العيادة (للنص فقط)</span><input id="i_addr"></label></div>
  <label class="f"><span>العبارة الختامية على الصورة</span><textarea id="i_cta"></textarea></label>
  <div class="row"><button class="btn p" id="save">حفظ وتحديث الصور</button><button class="btn" id="all">تنزيل كل الصور (ZIP)</button><span class="status" id="astat"></span></div>
 </div>
 <div class="list" id="list"></div>
</main>
<div class="scrim" id="scrim"><div class="viewer" id="viewer"></div></div>
<div class="toast" id="toast"></div>

const POSTS=[
{id:"cotton",cat:"ear",icon:"cotton",kicker:"خرافة شائعة",title:"أعواد القطن ليست لتنظيف الأذن",pts:["الأذن تنظّف نفسها بنفسها","العود يدفع الشمع للداخل ويسد القناة","قد يسبب التهاباً أو ثقباً في الطبلة","نظّف الصيوان من الخارج فقط"],
cap:"هل تنظف أذنك بأعواد القطن كل يوم؟ 🚫\n\nشمع الأذن ليس وساخة، بل مادة طبيعية تحمي الأذن من الغبار والالتهابات، والأذن تتخلص منه لوحدها.\n\nاستعمال الأعواد داخل القناة يدفع الشمع للعمق، فيسبب انسداداً وضعف سمع، وقد يجرح القناة أو يثقب الطبلة.\n\n✅ نظّف الصيوان وخلف الأذن بالمنشفة فقط.\n✅ إذا شعرت بانسداد، راجع العيادة لإزالة الشمع بالطريقة الآمنة."},
{id:"ssnhl",cat:"ear",icon:"clock",kicker:"حالة طارئة",title:"ضعف السمع المفاجئ لا ينتظر",pts:["فقدان سمع في أذن واحدة خلال ساعات أو أيام","ليس دائماً شمعاً أو ماءً في الأذن","العلاج المبكر يرفع فرصة رجوع السمع","راجع الطبيب خلال يوم أو يومين"],
cap:"صحيت من النوم وأذنك مسكّرة أو السمع ضعيف فجأة؟ ⏰\n\nضعف السمع المفاجئ من نوع العصب حالة طارئة في الأذن، وكثير من المرضى يتأخرون لظنهم أنه شمع أو ماء.\n\nكلما بدأ العلاج بشكل أبكر، زادت فرصة رجوع السمع.\n\n⚠️ إذا فقدت السمع فجأة في أذن واحدة، مع طنين أو دوخة أو بدونهما، راجع طبيب الأنف والأذن والحنجرة في أسرع وقت، ولا تنتظر أن يتحسن لوحده."},
{id:"tinnitus",cat:"ear",icon:"waves",kicker:"سؤال متكرر",title:"طنين الأذن: متى أقلق؟",pts:["الطنين شائع وغالباً غير خطير","افحص السمع، فكثيراً ما يصاحبه ضعف","راجع إذا كان في أذن واحدة أو نبضياً","قلّل الضجيج والكافيين وتوتر النوم"],
cap:"صوت صفير أو وشيش في الأذن لا يسمعه غيرك؟ 🔔\n\nالطنين عرض شائع جداً، وأسبابه كثيرة: ضعف السمع مع العمر، التعرض للضجيج، شمع الأذن، بعض الأدوية، والتوتر.\n\nراجع العيادة إذا كان الطنين:\n▪ في أذن واحدة فقط\n▪ يدق مع نبض القلب\n▪ مع ضعف سمع مفاجئ أو دوخة\n\nفحص السمع هو الخطوة الأولى، وهناك طرق كثيرة تساعد على التعايش مع الطنين وتخفيفه."},
{id:"aom",cat:"kids",icon:"ear",kicker:"للأهل",title:"التهاب الأذن عند طفلك",pts:["ألم الأذن وحرارة وبكاء ليلي من أشهر العلامات","المسكّن وخافض الحرارة أهم خطوة أولى","ليس كل التهاب يحتاج مضاداً حيوياً","لا تضع زيتاً أو قطرات بدون فحص"],
cap:"طفلك يبكي ويمسك أذنه بعد رشح؟ 👂\n\nالتهاب الأذن الوسطى من أكثر أمراض الأطفال شيوعاً، وغالباً يأتي بعد الزكام.\n\n✅ ابدأ بمسكّن وخافض حرارة مناسب لعمر ووزن الطفل.\n✅ كثير من الحالات تتحسن خلال 2 إلى 3 أيام، والطبيب يقرر إن كان طفلك يحتاج مضاداً حيوياً حسب عمره وشدة الحالة.\n❌ لا تضع زيت الزيتون أو أي قطرة في أذن الطفل قبل فحصها.\n\nراجع فوراً إذا ظهر تورم خلف الأذن، أو إفرازات، أو حرارة عالية مستمرة."},
{id:"ome",cat:"kids",icon:"childMouth",kicker:"للأهل",title:"طفلك يرفع صوت التلفاز؟",pts:["قد يكون ماءً خلف طبلة الأذن","شائع بين عمر سنتين و7 سنوات","يسبب ضعف سمع مؤقت بدون ألم","افحص سمع طفلك إذا لاحظت ذلك"],
cap:"طفلك لا يرد عندما تناديه، أو يقترب من التلفاز، أو تراجع في المدرسة؟ 📺\n\nأحد الأسباب الشائعة: تجمع سائل خلف طبلة الأذن بعد الزكام أو بسبب تضخم اللحمية. هذا السائل لا يسبب ألماً غالباً، لكنه يضعف السمع ويؤثر على الكلام والتعلم.\n\nمعظم الحالات تتحسن خلال 3 أشهر، لكن إذا استمر وأثر على السمع فهناك علاج فعال.\n\n✅ افحص أذن طفلك وسمعه في العيادة."},
{id:"newborn",cat:"kids",icon:"baby",kicker:"من أول شهر",title:"فحص السمع لكل مولود",pts:["فحص سريع وآمن ولا يؤلم الطفل","يُجرى قبل عمر شهر","التشخيص قبل 3 أشهر والعلاج قبل 6 أشهر","السمع المبكر أساس الكلام"],
cap:"هل فحصت سمع مولودك؟ 👶\n\nمن كل ألف مولود، طفل إلى ثلاثة يولدون بضعف سمع، وأغلبهم يبدون طبيعيين تماماً.\n\nالقاعدة الذهبية: فحص قبل عمر شهر، تشخيص قبل 3 أشهر، وتدخل قبل 6 أشهر. هكذا يتعلم الطفل الكلام في وقته الطبيعي.\n\nالفحص سهل وسريع ولا يؤلم الطفل، ويُجرى غالباً وهو نائم."},
{id:"noise",cat:"ear",icon:"headphones",kicker:"احمِ سمعك",title:"قاعدة 60/60 للسماعات",pts:["لا تتجاوز 60% من أعلى صوت","لا أكثر من 60 دقيقة متواصلة","الضجيج يتلف خلايا السمع بشكل دائم","استعمل واقيات الأذن في أماكن الضجيج"],
cap:"سماعات الأذن طول اليوم وعلى أعلى صوت؟ 🎧\n\nالتعرض للأصوات العالية يتلف خلايا السمع الدقيقة في الأذن الداخلية، وهذا التلف لا يعود.\n\nاتبع قاعدة 60/60:\n▪ الصوت أقل من 60% من الحد الأقصى\n▪ لا أكثر من 60 دقيقة متواصلة، ثم استراحة\n\nإذا سمعت طنيناً بعد مكان صاخب، فهذه إشارة من أذنك أن الصوت كان أعلى من اللازم."},
{id:"swimmer",cat:"ear",icon:"drop",kicker:"صيف وسباحة",title:"أذن السبّاح",pts:["ألم عند لمس الأذن أو شدها","حكة وإفرازات وانسداد","علاجها بقطرات يصفها الطبيب","أبقِ الأذن جافة وابتعد عن الأعواد"],
cap:"بعد السباحة أو الاستحمام، ألم في الأذن يزيد عند لمسها؟ 🏊\n\nهذا غالباً التهاب الأذن الخارجية (أذن السبّاح)، يحدث عندما تبقى الرطوبة في القناة أو بعد حكها بالأعواد.\n\n✅ العلاج بقطرات موصوفة من الطبيب بعد تنظيف الأذن.\n✅ أبقِ الأذن جافة تماماً حتى الشفاء.\n✅ نشّف الأذن بإمالة الرأس بعد السباحة.\n\n⚠️ مرضى السكري: ألم الأذن الشديد يحتاج مراجعة عاجلة."},
{id:"bppv",cat:"ear",icon:"swirl",kicker:"الدوخة",title:"الدنيا تلف عند التقلب في السرير؟",pts:["دوخة قصيرة مع تغيير وضعية الرأس","سببها حبيبات تحركت داخل الأذن","علاجها بمناورة بسيطة في العيادة","ليست جلطة ولا خطراً غالباً"],
cap:"تشعر بدوار شديد لثوانٍ عندما تستلقي أو تتقلب أو تنظر للأعلى؟ 🌀\n\nهذا غالباً الدوار الوضعي الحميد، أشهر أسباب الدوخة من الأذن. سببه حبيبات صغيرة تحركت من مكانها داخل الأذن الداخلية.\n\nالخبر الجيد: علاجه في أغلب الحالات بمناورة بسيطة في العيادة تستغرق دقائق، بدون أدوية طويلة.\n\n⚠️ الدوخة مع ضعف في الأطراف أو تلعثم في الكلام أو صداع شديد مفاجئ تحتاج طوارئ فوراً."},
{id:"bell",cat:"ear",icon:"face",kicker:"لا تتأخر",title:"شلل الوجه المفاجئ",pts:["ضعف نصف الوجه وعدم إغلاق العين","العلاج خلال أول 72 ساعة أفضل","احمِ العين من الجفاف","معظم المرضى يتحسنون"],
cap:"صحيت ولقيت فمك مايل وعينك لا تغلق؟ 😐\n\nشلل الوجه النصفي المفاجئ (شلل بل) يصيب عصب الوجه، ويخيف المريض كثيراً، لكن معظم الحالات تتحسن مع العلاج.\n\n⏱️ العلاج يكون أفضل إذا بدأ خلال أول 72 ساعة، فلا تتأخر.\n👁️ العين التي لا تغلق تحتاج قطرات مرطبة وتغطية أثناء النوم.\n\n⚠️ إذا صاحب الشلل ضعف في اليد أو الرجل أو صعوبة في الكلام، توجه للطوارئ فوراً."},
{id:"epistaxis",cat:"nose",icon:"noseDrop",kicker:"إسعاف أولي",title:"نزيف الأنف: الرأس للأمام وليس للخلف",pts:["اجلس وانحنِ للأمام قليلاً","اضغط على الجزء الطري من الأنف","استمر 10 إلى 15 دقيقة بدون توقف","ابصق الدم ولا تبلعه"],
cap:"نزل دم من أنف ابنك؟ الأهم: لا ترجع رأسه للخلف! 🩸\n\nإرجاع الرأس للخلف يجعل الدم ينزل للحلق والمعدة ويسبب استفراغاً.\n\nالطريقة الصحيحة:\n1️⃣ اجلس وانحنِ برأسك للأمام قليلاً\n2️⃣ اضغط بإصبعين على الجزء الطري من الأنف (تحت العظم)\n3️⃣ استمر 10 إلى 15 دقيقة كاملة بدون ما تفلت\n4️⃣ تنفس من الفم\n\n⚠️ توجه للطوارئ إذا لم يتوقف بعد 20 دقيقة، أو كان غزيراً، أو بعد ضربة على الرأس."},
{id:"allergy",cat:"nose",icon:"pollen",kicker:"موسم الحساسية",title:"عطاس وحكة ورشح كل صباح؟",pts:["قد تكون حساسية الأنف وليس زكاماً","المحفزات: الغبار والعث والوبر وحبوب اللقاح","غسيل الأنف وبخاخ الكورتيزون أساس العلاج","الحساسية غير المعالجة تؤثر على النوم والربو"],
cap:"عطاس متكرر، رشح مائي، حكة في الأنف والعيون، وانسداد يتكرر كل يوم؟ 🤧\n\nهذه علامات حساسية الأنف، وليست زكاماً متكرراً.\n\n✅ قلّل التعرض للغبار، واغسل الشراشف بماء ساخن.\n✅ غسيل الأنف بالمحلول الملحي يومياً.\n✅ بخاخ الكورتيزون الأنفي آمن وفعال عند استعماله بالطريقة الصحيحة وبانتظام.\n\nعلاج الحساسية يحسن النوم والتركيز، ويساعد في السيطرة على الربو."},
{id:"sinus",cat:"nose",icon:"sinus",kicker:"معلومة مهمة",title:"التهاب الجيوب: هل أحتاج مضاداً؟",pts:["معظم الحالات فيروسية وتتحسن في 7 إلى 10 أيام","المضاد الحيوي لا يفيد مع الفيروس","غسيل الأنف والمسكنات تخفف الأعراض","راجع إذا زادت بعد تحسن أو تجاوزت 10 أيام"],
cap:"ضغط في الوجه وانسداد وإفرازات بعد الزكام؟ أول ما تفكر فيه المضاد الحيوي؟ 💊\n\nأغلب التهابات الجيوب الحادة فيروسية، وتتحسن خلال 7 إلى 10 أيام، والمضاد الحيوي لا يقصّرها بل يسبب آثاراً جانبية ومقاومة للبكتيريا.\n\n✅ غسيل الأنف بالمحلول الملحي، والسوائل، والمسكنات.\n\nراجع الطبيب إذا:\n▪ استمرت الأعراض أكثر من 10 أيام\n▪ تحسنت ثم ساءت فجأة\n▪ ظهر تورم حول العين أو صداع شديد أو حرارة عالية ⚠️"},
{id:"decong",cat:"nose",icon:"spray",kicker:"احذر",title:"بخاخ فتح الأنف: 5 أيام فقط",pts:["يفتح الأنف بسرعة لكن مفعوله مؤقت","الاستعمال الطويل يسبب انسداداً أشد","يصعب التوقف عنه بعدها","اسأل عن البدائل الآمنة للاستعمال الطويل"],
cap:"صرت ما تقدر تنام بدون بخاخ الأنف؟ 👃\n\nبخاخات مزيلات الاحتقان (مثل أوكسي ميتازولين وزايلوميتازولين) تفتح الأنف خلال دقائق، لكن استعمالها أكثر من 5 أيام يسبب ما يسمى «الاعتماد على البخاخ»: الأنف ينسد أكثر كلما خف مفعوله، فتزيد الجرعات.\n\n✅ لا تستعملها أكثر من 5 أيام متواصلة.\n✅ إذا كنت تستعملها منذ فترة طويلة، راجع العيادة، فالتوقف عنها ممكن بخطة بسيطة وبدائل آمنة."},
{id:"saline",cat:"nose",icon:"bottle",kicker:"نصيحة يومية",title:"غسيل الأنف بالمحلول الملحي",pts:["ينظف الأنف من الإفرازات والغبار والحساسية","مفيد للجيوب وبعد عمليات الأنف","استعمل ماءً مغلياً ومبرداً أو معبأً","استعمله قبل بخاخ الكورتيزون"],
cap:"أبسط علاج للأنف وأكثرها فائدة؟ غسيل الأنف 💧\n\nالمحلول الملحي يغسل الإفرازات والغبار ومسببات الحساسية، ويحسن مفعول البخاخات، ويخفف القشور بعد العمليات.\n\nتحضيره في البيت:\n▪ كوب ماء مغلي ومبرد حتى يصبح فاتراً\n▪ نصف ملعقة صغيرة ملح بدون يود\n▪ ربع ملعقة صغيرة بيكربونات صوديوم\n\n⚠️ لا تستعمل ماء الحنفية بدون غلي، وحضّره طازجاً كل يوم."},
{id:"fbnose",cat:"kids",icon:"bead",kicker:"علامة لا تهملها",title:"إفرازات كريهة من جهة واحدة عند طفلك",pts:["قد يكون جسماً غريباً داخل الأنف","خرزة أو حبة أو قطعة لعبة","لا تحاول إخراجه بنفسك","راجع الطبيب في نفس اليوم"],
cap:"طفلك عنده إفرازات خضراء برائحة كريهة من فتحة أنف واحدة فقط؟ 👃\n\nعند الأطفال الصغار، هذه العلامة غالباً تعني جسماً غريباً داخل الأنف: خرزة، حبة ذرة أو حمص، ورقة، أو قطعة لعبة.\n\n❌ لا تحاول إخراجه بالأصابع أو الأدوات، فقد تدفعه للداخل.\n✅ راجع طبيب الأنف والأذن والحنجرة في نفس اليوم.\n\n⚠️ إذا كان الجسم بطارية صغيرة، فهذه حالة طارئة تحتاج إزالة فورية."},
{id:"adenoid",cat:"kids",icon:"moon",kicker:"للأهل",title:"الشخير عند الأطفال ليس طبيعياً",pts:["الشخير المستمر وتوقف النفس يحتاج تقييماً","السبب الأشهر تضخم اللوزتين واللحمية","يؤثر على النمو والتركيز والسلوك","التنفس من الفم ليلاً علامة مهمة"],
cap:"طفلك يشخر كل ليلة ويتنفس من فمه؟ 😴\n\nالشخير عند الأطفال ليس علامة نوم عميق. إذا كان مستمراً (3 ليالٍ أو أكثر في الأسبوع)، أو صاحبه توقف في النفس أو نوم متقطع، فقد يكون انقطاع نفس أثناء النوم.\n\nالعلامات النهارية: عصبية، فرط حركة، ضعف تركيز في المدرسة، وأحياناً تأخر في النمو.\n\nالسبب الأشهر تضخم اللوزتين واللحمية، والعلاج متوفر وفعال بعد التقييم."},
{id:"hoarse",cat:"throat",icon:"calendar",kicker:"قاعدة الثلاثة أسابيع",title:"بحة أكثر من 3 أسابيع؟",pts:["أغلب البحة بسيطة وتتحسن خلال أيام","استمرارها يحتاج منظاراً للحنجرة","أهم شيء للمدخنين","الفحص في العيادة سريع وبدون تخدير عام"],
cap:"صوتك مبحوح منذ أسابيع؟ 🗣️\n\nمعظم البحة سببها زكام أو إجهاد للصوت، وتتحسن خلال أيام. لكن أي بحة تستمر أكثر من 3 أسابيع تحتاج فحص الحنجرة بالمنظار، خاصة عند المدخنين.\n\nالفحص يتم في العيادة خلال دقائق، ويرى الأحبال الصوتية مباشرة.\n\n⚠️ راجع بشكل أسرع إذا صاحب البحة صعوبة بلع، أو ألم في الأذن، أو كتلة في الرقبة، أو ضيق نفس."},
{id:"tonsil",cat:"throat",icon:"tonsils",kicker:"سؤال الأهل الأشهر",title:"متى نزيل اللوزتين؟",pts:["التهابات متكررة كثيرة في السنة","شخير وتوقف نفس أثناء النوم","خراج حول اللوزة يتكرر","القرار بعد الفحص وليس لكل التهاب"],
cap:"\"كل شهر التهاب لوزتين، لازم نشيلهم؟\" 🤔\n\nاستئصال اللوزتين له أسباب واضحة، منها:\n▪ التهابات شديدة متكررة: 7 مرات في سنة، أو 5 سنوياً لسنتين، أو 3 سنوياً لثلاث سنوات\n▪ شخير مع توقف نفس أثناء النوم\n▪ خراج حول اللوزة متكرر\n▪ تضخم في جهة واحدة يحتاج فحصاً\n\nليس كل التهاب يعني عملية، والقرار يكون بعد التقييم في العيادة."},
{id:"sore",cat:"throat",icon:"throat",kicker:"معلومة مهمة",title:"التهاب الحلق: معظمه فيروسي",pts:["الكحة والرشح يرجحان الفيروس","المضاد الحيوي فقط للالتهاب البكتيري","السوائل والمسكنات والراحة تكفي غالباً","راجع إذا صعب البلع أو فتح الفم"],
cap:"التهاب حلق؟ مش لازم مضاد حيوي! 🍯\n\nأغلب التهابات الحلق سببها فيروسات، خاصة إذا صاحبها كحة ورشح وبحة، وتتحسن خلال أسبوع بالسوائل الدافئة والمسكنات والراحة.\n\nالطبيب يقرر الحاجة للمضاد الحيوي حسب الفحص (حرارة، لوزتين متورمتين مع صديد، غدد مؤلمة في الرقبة، بدون كحة).\n\n⚠️ راجع فوراً إذا: صعوبة شديدة في البلع أو فتح الفم، ريالة، تغير في الصوت، أو صعوبة في التنفس."},
{id:"reflux",cat:"throat",icon:"flame",kicker:"نصائح يومية",title:"حرقة في الحلق وتنحنح مستمر؟",pts:["قد يكون ارتجاعاً للحمض نحو الحنجرة","لا تأكل قبل النوم بثلاث ساعات","قلّل القهوة والمشروبات الغازية والدسم","ارفع رأس السرير قليلاً"],
cap:"تنحنح مستمر، إحساس بشيء عالق في الحلق، بحة صباحية؟ 🔥\n\nقد يكون السبب ارتجاع الحمض من المعدة إلى الحلق والحنجرة، حتى بدون حرقة في المعدة.\n\nنصائح تخفف الارتجاع:\n✅ لا تأكل قبل النوم بثلاث ساعات\n✅ ارفع رأس السرير\n✅ قلل القهوة والشاي والمشروبات الغازية والأكل الدسم والحار\n✅ خفف الوزن وتوقف عن التدخين\n\nإذا استمرت الأعراض، راجع العيادة لفحص الحنجرة."},
{id:"smoke",cat:"neck",icon:"cig",kicker:"صحتك أهم",title:"التدخين والشيشة خطر على حلقك",pts:["السبب الأول لسرطان الحنجرة والفم","جلسة شيشة قد تعادل دخان عشرات السجائر","الخطر يقل بعد التوقف","أي تقرح في الفم لا يلتئم خلال 3 أسابيع يحتاج فحصاً"],
cap:"\"الشيشة أخف من السجائر\"؟ خرافة! 🚭\n\nالتدخين بكل أنواعه، ومنه الشيشة، هو السبب الأول لسرطانات الحنجرة والفم والبلعوم. جلسة شيشة واحدة قد تعرضك لدخان يعادل عشرات السجائر.\n\nالخبر الجيد: الخطر يبدأ بالانخفاض من أول يوم تتوقف فيه.\n\n⚠️ راجع الطبيب إذا كان عندك: بحة أكثر من 3 أسابيع، تقرح في الفم لا يلتئم، صعوبة بلع، أو كتلة في الرقبة."},

cap:"كتلة في الرقبة لا تختفي؟ 🔎\n\nعند الأطفال، أغلب الكتل غدد ليمفاوية متضخمة بسبب التهابات بسيطة. أما عند البالغين، خاصة المدخنين وفوق 40 سنة، فأي كتلة تستمر أكثر من 3 أسابيع تحتاج تقييماً من طبيب الأنف والأذن والحنجرة.\n\nالتقييم يشمل فحص الأنف والحلق والحنجرة بالمنظار، وأحياناً أشعة وعينة بالإبرة.\n\n❌ لا تكرر المضادات الحيوية بدون تشخيص، فالتأخير قد يكون مكلفاً."},
{id:"thyroid",cat:"neck",icon:"thyroid",kicker:"طمّن قلبك",title:"عقد الغدة الدرقية شائعة",pts:["تظهر عند كثير من الناس بالأشعة","معظمها حميد","التقييم بالأشعة والتحاليل وأحياناً عينة","ليست كل عقدة تحتاج عملية"],
cap:"قالولك عندك عقدة في الغدة الدرقية؟ 🦋\n\nعقد الغدة الدرقية شائعة جداً، وتظهر عند نسبة كبيرة من الناس عند عمل أشعة للرقبة، ومعظمها حميد.\n\nالتقييم يكون:\n▪ تحليل هرمونات الغدة\n▪ أشعة تلفزيونية بتصنيف TI-RADS\n▪ عينة بالإبرة لبعض العقد حسب شكلها وحجمها\n\nكثير من العقد تحتاج متابعة فقط. العملية لها أسباب محددة: الشك بورم، أو الضغط على التنفس أو البلع، أو حجم كبير."},

cap:"⚠️ تحذير مهم لكل أم وأب ⚠️\n\nالبطارية القرصية الصغيرة (في الريموت والساعات والألعاب والموازين) من أخطر الأشياء التي يبلعها الأطفال. إذا علقت في المريء، تسبب حرقاً شديداً خلال ساعتين فقط.\n\nإذا شككت أن طفلك بلع بطارية:\n🚑 توجه للطوارئ فوراً، حتى لو كان الطفل يبدو طبيعياً\n❌ لا تحاول جعله يستفرغ\n\nالوقاية: تأكد من إغلاق غطاء البطاريات في الأجهزة، واحفظ البطاريات بعيداً عن الأطفال.\n\nشارك المنشور، فقد ينقذ طفلاً 🙏"},

cap:"فستق، بزر، فول سوداني لطفل عمره سنتين؟ 🥜❌\n\nالأطفال تحت 5 سنوات لا يمضغون جيداً، والمكسرات الصغيرة تُستنشق بسهولة إلى القصبات الهوائية، وقد تسبب اختناقاً أو التهاباً رئوياً متكرراً.\n\nالعلامات: كحة مفاجئة شديدة أثناء الأكل، ثم صفير في الصدر أو كحة لا تتوقف.\n\n🚑 إذا حدثت نوبة اختناق أو كحة مفاجئة بعد أكل المكسرات، راجع الطوارئ فوراً حتى لو هدأ الطفل.\n\nشارك المنشور مع العائلة 🙏"},

cap:"معلم، خطيب، منشد، أو موظف تتكلم طول اليوم؟ 🎙️\n\nالأحبال الصوتية تتعب مثل أي عضلة، والإجهاد المستمر قد يسبب عقداً عليها.\n\n✅ اشرب ماءً كافياً طول اليوم\n✅ استعمل مكبر الصوت بدل رفع صوتك\n✅ خذ فترات صمت قصيرة بين الحصص\n✅ ابلع ريقك بدل التنحنح\n❌ لا تهمس بقوة، فالهمس يجهد الصوت أيضاً\n❌ قلل التدخين والكافيين\n\nبحة مستمرة أكثر من 3 أسابيع؟ افحص الحنجرة."}

const FONTS=[
 {id:"Cairo",n:"Cairo",q:"Cairo:wght@500;700;800"},
 {id:"Tajawal",n:"Tajawal",q:"Tajawal:wght@500;700;800"},
 {id:"Almarai",n:"Almarai",q:"Almarai:wght@400;700;800"},
 {id:"IBM Plex Sans Arabic",n:"IBM Plex",q:"IBM+Plex+Sans+Arabic:wght@500;600;700"},
 {id:"Readex Pro",n:"Readex Pro",q:"Readex+Pro:wght@500;600;700"},
 {id:"Noto Kufi Arabic",n:"Noto Kufi",q:"Noto+Kufi+Arabic:wght@500;700;800"}
];
const KEY="ent-fbgen-v1";
const DEF={font:"Cairo",name:"د. عبد الهادي صيام",spec:"أخصائي جراحة الأنف والأذن والحنجرة والرأس والعنق",phone:"",addr:"",cta:"إذا كنت تعاني من هذه المشكلة أو لديك أي استفسار، لا تتردد في زيارتنا"};
let ST=(()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return Object.assign({},DEF)}})();
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
const WARN=/فوراً|خطر|خطيرة|تقلق|تراجع|يحتاج فحص|لا تُهمل|علامات تحتاج|متى تكون/;
function tint(hex){const n=parseInt(hex.slice(1),16);const m=x=>Math.round(x+(255-x)*.9);return `rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`}
/* ---------- fonts: fetch once, embed as data URLs so exported images keep the font ---------- */
const FONTCSS={};
async function b64(buf){return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(",")[1]);fr.readAsDataURL(new Blob([buf]))})}
async function loadFont(f){
  if(FONTCSS[f.id])return FONTCSS[f.id];
  const css=await (await fetch("https://fonts.googleapis.com/css2?family="+f.q+"&display=swap")).text();
  const faces=css.match(/@font-face\s*{[^}]*}/g)||[];
  const keep=faces.filter(x=>/U\+06|U\+0000-00FF/.test(x));
  let out="";
  for(const face of keep){const m=face.match(/url\((https:[^)]+)\)/);if(!m)continue;const buf=await (await fetch(m[1])).arrayBuffer();out+=face.replace(m[1],"data:font/woff2;base64,"+await b64(buf))+"\n"}
  if(!out)throw new Error("no faces");
  FONTCSS[f.id]=out;return out;
}
let curFontCSS="";
async function applyFont(){
  const f=FONTS.find(x=>x.id===ST.font)||FONTS[0];$("#fstat").textContent="جاري تحميل الخط…";
  try{curFontCSS=await loadFont(f);let st=$("#fontface");if(!st){st=document.createElement("style");st.id="fontface";document.head.appendChild(st)}st.textContent=curFontCSS;
    await document.fonts.load('800 40px "'+f.id+'"');await document.fonts.load('500 30px "'+f.id+'"');
    document.documentElement.style.setProperty("--cf",'"'+f.id+'"');$("#fstat").textContent="الخط: "+f.n;
  }catch(e){curFontCSS="";document.documentElement.style.setProperty("--cf","system-ui");$("#fstat").textContent="تعذّر تحميل الخط — تأكد من الاتصال بالإنترنت."}
}
/* ---------- card ---------- */
function cardHTML(p){
  const [cn,cc]=CATS[p.cat];const D=DETAILS[p.id];
  return `<div class="card" style="--c:${cc};--t:${tint(cc)}"><div class="hero"><div class="ring"></div><div class="ring2"></div><div class="top"><span class="cat">${cn}</span><span class="kick">${p.kicker}</span></div>
  <h1>${p.title}</h1><div class="sub">${p.pts[0]}، ${p.pts[1]}</div><div class="art"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${ICONS[p.icon]}</svg></div></div>
  <div class="body">${D.map((d,i)=>{const w=WARN.test(d[0])||(p.cat==="alert"&&i===1);return `<div class="sec ${w?"warn":""}"><h3><i>${w?"!":i+1}</i>${d[0]}</h3><div class="grid">${d[1].map(t=>`<div class="it"><b></b><span>${t}</span></div>`).join("")}</div></div>`}).join("")}</div>
  <div class="cta">${esc(ST.cta)}</div>
  <div class="ft"><div><b>${esc(ST.name)}</b><span>${esc(ST.spec)}</span></div>${ST.phone?`<div class="ph">${esc(ST.phone)}</div>`:""}<div class="logo"></div></div></div>`;
}
function fit(card){
  const h=card.querySelector(".hero"),sub=card.querySelector(".sub"),h1=card.querySelector("h1");
  let s=74;const lines=()=>h1.getBoundingClientRect().height/parseFloat(getComputedStyle(h1).lineHeight);while(lines()>3.2&&s>54){s-=2;h1.style.fontSize=s+"px"}
  if(sub&&sub.getBoundingClientRect().bottom>h.getBoundingClientRect().bottom-20)sub.remove();
  card.querySelectorAll(".sec").forEach(sec=>{let fs=34;sec.style.setProperty("--fs",fs+"px");while(sec.scrollHeight>sec.clientHeight+1&&fs>21){fs-=1;sec.style.setProperty("--fs",fs+"px")}});
  const cta=card.querySelector(".cta");let cf=31;while(cta.scrollHeight>110&&cf>22){cf-=1;cta.style.setProperty("--ctafs",cf+"px")}
}
function mount(holder,p,width){
  holder.innerHTML="";const wrap=document.createElement("div");wrap.innerHTML=cardHTML(p);const card=wrap.firstElementChild;
  wrap.style.width="1080px";wrap.style.height="1350px";holder.appendChild(wrap);
  wrap.style.transform=`scale(${width/1080})`;fit(card);return card;
}
/* ---------- export to PNG via SVG foreignObject (browser renders Arabic natively) ---------- */
async function toPNG(p){
  const host=document.createElement("div");host.style.cssText="position:fixed;left:-99999px;top:0;width:1080px;height:1350px";document.body.appendChild(host);
  const card=mount(host,p,1080);await new Promise(r=>setTimeout(r,30));
  const css=$("#cardcss").textContent.replace(/var\(--cf\)/g,'"'+ST.font+'"');
  const xml=new XMLSerializer().serializeToString(card);host.remove();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${curFontCSS}${css}</style>${xml}</div></foreignObject></svg>`;
  const img=new Image();img.decoding="sync";
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  await img.decode();await new Promise(r=>setTimeout(r,120));
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");x.drawImage(img,0,0);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
function fname(p,i){return String(i+1).padStart(2,"0")+"-"+p.id+".png"}
function caption(p){return p.cap+"\n\n"+ST.cta+" 🤍"+(ST.addr?"\n📍 "+ST.addr:"")+(ST.phone?"\n📞 للحجز: "+ST.phone:"")+"\n— "+ST.name+"، "+ST.spec+H}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
/* ---------- UI ---------- */
function drawList(){
  const L=$("#list");L.innerHTML="";
  POSTS.forEach((p,i)=>{const b=document.createElement("button");b.className="thumb";b.innerHTML=`<div class="sc"></div><b>${i+1}. ${p.title}</b>`;L.appendChild(b);
    requestAnimationFrame(()=>mount(b.querySelector(".sc"),p,b.querySelector(".sc").clientWidth));b.onclick=()=>openPost(i)});
}
function openPost(i){
  const p=POSTS[i];const v=$("#viewer");
  v.innerHTML=`<div class="big"></div><div class="row" style="margin-top:10px"><button class="btn p" id="vshare">مشاركة الصورة</button><button class="btn" id="vdl">تنزيل الصورة</button><button class="btn" id="vcopy">نسخ النص</button><button class="btn" id="vx" style="margin-right:auto">إغلاق</button></div><textarea id="vcap">${esc(caption(p))}</textarea>`;
  $("#scrim").classList.add("open");requestAnimationFrame(()=>mount(v.querySelector(".big"),p,v.querySelector(".big").clientWidth));
  $("#vx").onclick=()=>$("#scrim").classList.remove("open");
  $("#vcopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#vcap").value);toast("انسخ النص")}catch(e){$("#vcap").select();document.execCommand("copy");toast("انسخ النص")}};
  $("#vdl").onclick=async()=>{toast("جاري تجهيز الصورة…");try{dl(await toPNG(p),fname(p,i))}catch(e){toast("تعذّر إنشاء الصورة")}};
  $("#vshare").onclick=async()=>{toast("جاري تجهيز الصورة…");try{const blob=await toPNG(p);const file=new File([blob],fname(p,i),{type:"image/png"});
    try{await navigator.clipboard.writeText($("#vcap").value)}catch(e){}
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:$("#vcap").value});toast("النص منسوخ أيضاً — الصقه إذا لم يظهر")}else{dl(blob,file.name);toast("تنزّلت الصورة")}}catch(e){if(e.name!=="AbortError")toast("تعذّرت المشاركة")}};
}
$("#scrim").onclick=e=>{if(e.target.id==="scrim")$("#scrim").classList.remove("open")};
function fillForm(){$("#i_name").value=ST.name;$("#i_spec").value=ST.spec;$("#i_phone").value=ST.phone;$("#i_addr").value=ST.addr;$("#i_cta").value=ST.cta}
function drawFonts(){$("#fonts").innerHTML=FONTS.map(f=>`<button data-f="${f.id}" aria-pressed="${ST.font===f.id}" style="font-family:'${f.id}',system-ui">عيادة الأنف والأذن<small>${f.n}</small></button>`).join("");
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=async()=>{ST.font=b.dataset.f;save();drawFonts();await applyFont();drawList()})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
$("#save").onclick=()=>{ST.name=$("#i_name").value.trim()||DEF.name;ST.spec=$("#i_spec").value.trim();ST.phone=$("#i_phone").value.trim();ST.addr=$("#i_addr").value.trim();ST.cta=$("#i_cta").value.trim()||DEF.cta;save();drawList();toast("انحفظ وتحدّثت الصور")};
$("#all").onclick=async()=>{
  const st=$("#astat");
  if(!window.JSZip){st.textContent="جاري التحميل…";await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)}).catch(()=>{})}
  if(!window.JSZip){st.textContent="تعذّر تحميل أداة الضغط";return}
  const z=new JSZip();const txt=[];
  for(let i=0;i<POSTS.length;i++){st.textContent=`تجهيز ${i+1} من ${POSTS.length}…`;try{z.file("Images/"+fname(POSTS[i],i),await toPNG(POSTS[i]))}catch(e){}txt.push(`━━━━━━━━━━\n${i+1} — ${POSTS[i].title} (${fname(POSTS[i],i)})\n━━━━━━━━━━\n\n${caption(POSTS[i])}\n\n`)}
  z.file("نصوص المنشورات.txt",txt.join("\n"));st.textContent="جاري الضغط…";
  dl(await z.generateAsync({type:"blob"}),"clinic-posts.zip");st.textContent="تنزّل الملف ✓";
};
document.documentElement.style.setProperty("--uif","system-ui");
fillForm();drawFonts();applyFont().then(drawList);
for(const f of FONTS){const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+f.q.split(":")[0]+":wght@700&display=swap&text="+encodeURIComponent("عيادة الأنف والأذن");document.head.appendChild(l)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
